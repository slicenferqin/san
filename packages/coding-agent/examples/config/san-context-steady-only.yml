# San v0.1 Only: context steady enabled, execution loop disabled.
#
# Used by the GSAR benchmark to isolate context-steady's contribution to
# goal preservation WITHOUT multi-role execution loop overhead.
# Comparison: single-agent + context steady vs single-agent raw vs v0.2 multi-role.
san:
  contextSteady:
    enabled: true
    digest:
      enabled: true
      persistFallback: true
      timeoutMs: 30000
      llm:
        enabled: true
        modelRole: vb/gpt-5.5
    qualityWindowTokens: 24000
    reserveRatio: 0.25
    contextPacket:
      enabled: true
      recentDigests: 5
      maxTokens: 3000
    checkpoint:
      enabled: true
      everyTurns: 6
      maxTokens: 12000
    recall:
      enabled: false
      maxItems: 3
      maxTokens: 1000
      maxQueryChars: 2000
  executionLoop:
    enabled: false
