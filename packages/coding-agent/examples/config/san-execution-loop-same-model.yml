# San v0.2 same-model execution loop benchmark overlay.
#
# This keeps the San multi-role runtime enabled while routing every role to the
# same GPT selector. Use it to isolate whether role separation itself improves
# delivery quality before introducing heterogeneous provider economics.
san:
  contextSteady:
    enabled: true
    digest:
      enabled: true
      persistFallback: true
      timeoutMs: 30000
      llm:
        enabled: true
        modelRole: vb/gpt-5.5
    qualityWindowTokens: 24000
    reserveRatio: 0.25
    contextPacket:
      enabled: true
      recentDigests: 5
      maxTokens: 3000
    checkpoint:
      enabled: true
      everyTurns: 6
      maxTokens: 12000
    recall:
      enabled: false
      maxItems: 3
      maxTokens: 1000
      maxQueryChars: 2000
  executionLoop:
    enabled: true
    defaultMode: deep
    maxRetries: 2
    maxWorkers: 3
    ledger:
      enabled: true
      persistRolePackets: true
    checks:
      enabled: true
      includeBuiltins: true
      projectDir: .omp/checks
    roles:
      commander:
        modelRole: vb/gpt-5.5:xhigh
      worker:
        modelRole: vb/gpt-5.5:xhigh
      supervisor:
        modelRole: vb/gpt-5.5:xhigh
      oracle:
        modelRole: vb/gpt-5.5:xhigh
        enabledInModes:
          - smart
          - deep
    roleContext:
      tokenBudget: 2000
      maxEvents: 8
      maxDecisions: 8
    budget:
      rushMaxTurns: 3
      smartMaxTurns: 8
      deepMaxTurns: 16
      reserveRatio: 0.25
