# San 仓库 self-hosting 项目配置。
#
# 只放模型选择和执行策略，不放 provider key。密钥继续放在用户级配置、
# 环境变量或未跟踪的 agent dir 中。
modelRoles:
  default: sol:xhigh
  smol: ds-pro
  slow: sol
  plan: sol:xhigh
  advisor: terra
  task: luna:max

setupVersion: 1

startup:
  quiet: true
  showSplash: false
  setupWizard: false

tools:
  xdev: true
  xdevDocs: catalog

san:
  contextSteady:
    enabled: true
    digest:
      enabled: true
      persistFallback: true
      timeoutMs: 30000
      llm:
        enabled: true
        modelRole: ds-flash
    # steady 200000 / control 216666 / burst 219300 on a 258000 window.
    # reserveRatio 0.25 put the reserve-derived hard ceiling at 193500, below the 240000
    # quality window, which clamped steady == control == burst: no elastic headroom, so every
    # pressure spike became an immediate compaction and each compaction rewrote the cache prefix.
    qualityWindowTokens: 200000
    reserveRatio: 0.15
    contextPlan:
      enabled: true
      recentDigests: 5
      maxTokens: 3000
      recentExactTokens: 16000
      liveTailTokens: 24000
    segment:
      enabled: true
      maxTokens: 40000
      maxDurationMs: 900000
      maxDigestInputTokens: 160000
    hardPressure:
      maxRecoveryPasses: 1
    checkpoint:
      enabled: true
      everyTurns: 6
      maxTokens: 12000
    recall:
      enabled: true
      maxItems: 3
      maxTokens: 1000
      maxQueryChars: 2000

  executionLoop:
    enabled: true
    defaultMode: solo
    maxRetries: 2
    maxWorkers: 3
    ledger:
      enabled: true
      persistRolePackets: true
    checks:
      enabled: true
      includeBuiltins: true
      projectDir: .san/checks
    roles:
      commander:
        modelRole: slow
      worker:
        modelRole: smol
      supervisor:
        modelRole: advisor
      oracle:
        modelRole: plan
        enabledInModes:
          - council
    roleContext:
      tokenBudget: 2000
      maxEvents: 8
      maxDecisions: 8
    budget:
      soloMaxTurns: 3
      teamMaxTurns: 8
      councilMaxTurns: 16
      reserveRatio: 0.25
