# San 仓库 self-hosting 项目配置。
#
# 只放模型选择和执行策略，不放 provider key。密钥继续放在用户级配置、
# 环境变量或未跟踪的 agent dir 中。
# 角色值必须是可解析的目标:全限定 model id,或带 `@` 前缀的角色引用
# (`@smol`)。裸角色名(`smol`)不是角色引用 —— 它走模糊模型名匹配,匹配不到就
# 静默 UNRESOLVED,调用方各自降级(digest 落 fallback 摘要)。历史踩坑:`ds-flash`
# 与 `ds-pro` 两个字面量在 models.yml 里都不存在,导致 smol 角色长期解析失败。
modelRoles:
  default: sol:xhigh
  smol: cpa/opencode-go/mimo-v2.5
  slow: sol
  vision: cpa/asxs-grok/grok-4.6
  plan: cpa/agentrouter/claude-opus-5
  advisor: cpa/asxs/gpt-5.6-sol
  task: cpa/zhou/gpt-5.6-luna

setupVersion: 1

startup:
  quiet: true
  showSplash: false
  setupWizard: false

tools:
  xdev: true
  xdevDocs: catalog

san:
  contextSteady:
    enabled: true
    digest:
      enabled: true
      persistFallback: true
      timeoutMs: 30000
      llm:
        enabled: true
        # 全限定 id:摘要模型与 smol 角色解耦,调角色不会牵动摘要档位。
        modelRole: cpa/opencode-go/mimo-v2.5
    # steady 200000 / control 216666 / burst 219300 on a 258000 window.
    # reserveRatio 0.25 put the reserve-derived hard ceiling at 193500, below the 240000
    # quality window, which clamped steady == control == burst: no elastic headroom, so every
    # pressure spike became an immediate compaction and each compaction rewrote the cache prefix.
    qualityWindowTokens: 200000
    reserveRatio: 0.15
    contextPlan:
      enabled: true
      recentDigests: 5
      maxTokens: 3000
      recentExactTokens: 16000
      liveTailTokens: 24000
    segment:
      enabled: true
      maxTokens: 40000
      maxDurationMs: 900000
      maxDigestInputTokens: 160000
    hardPressure:
      maxRecoveryPasses: 1
    checkpoint:
      enabled: true
      everyTurns: 6
      maxTokens: 12000
    recall:
      enabled: true
      maxItems: 3
      maxTokens: 1000
      maxQueryChars: 2000

  executionLoop:
    enabled: true
    defaultMode: solo
    maxRetries: 2
    maxWorkers: 3
    ledger:
      enabled: true
      persistRolePackets: true
    checks:
      enabled: true
      includeBuiltins: true
      projectDir: .san/checks
    roles:
      commander:
        modelRole: slow
      worker:
        modelRole: smol
      supervisor:
        modelRole: advisor
      oracle:
        modelRole: plan
        enabledInModes:
          - council
    roleContext:
      tokenBudget: 2000
      maxEvents: 8
      maxDecisions: 8
    budget:
      soloMaxTurns: 3
      teamMaxTurns: 8
      councilMaxTurns: 16
      reserveRatio: 0.25
